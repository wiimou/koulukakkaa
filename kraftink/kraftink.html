        <title>Kraftink</title>

        <style>

            html body{
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                min-height: 100%;
            }
            body {
                font-family: Times New Roman, serif;

                background-color: #000000f4;
                background-image: url("img/kraftink.tausta.jpg");

                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                background-attachment: fixed;
            }

            .navbar {
                position: relative;
                background-color: #727272;
                height: 60px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0px 20px;
                z-index: 1000;
            }

            .logo-container {
                position: relative;
            }

            .logo {
                height: 100px;
                position: absolute;
                top: -10%;
                display: block;
            }

            .nav-links {
                display: flex;
                gap: 20px;
                margin-left: auto;
            }

            .nav-links a {
                color: #fff;
                text-decoration: none;
                font-size: 16px;
                transition: color 0.3s ease;
            }

            .main-container {
                flex: 1;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 20px;
            }

            .content-box {
                background-color: rgba(0,0,0,0.8);
                color: #ffffff;
                padding: 40px;
                border-radius: 10px;
                max-width: 600px;
                text-align: center;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            }

            .content-box h1 {
                margin-top: 0;
                font-size: 2.5rem;
            }

            .content-box p {
                font-size: 1.2rem;
                line-height: 1.6;
            }

            .button-link {
                display: inline-block;
                padding: 10px 20px;
                background-color: #727272;
                color: #ffffff;
                text-decoration: none;
                border-radius: 0px;
                transition: background-color 0.3s ease;

            }
            
        </style>
        </head>
    <body>
        <nav class="navbar">
            <div class="navbar-container">
                <img src="img\kraftink_logo.png" alt="Logo" class="logo">
            </div>

            <div class="nav-links"> <!--navigointilinkit-->
                <a href="kraftink.html">Etusivu</a>
                <a href="portfolio.html">Portfolio</a>
                <a href="about_us.html">ABOUT US</a>

                <a href="ota_yhteytta.html">Ota yhteyttä</a>
          </div>
        </nav>

        <div class="main-container">
            <div class="content-box">
                <p>darling, is it time for tattoo yet?</p>
                <a href="ota_yhteytta.html" class="button-link">Varaa aika <3 </a>
            </div>
        </div>
    </body>
