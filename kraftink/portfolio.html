            body {

            .navbar {
                position: relative;
                background-color: #727272;
                height: 60px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0px 20px;
                z-index: 1000;
            }

            .logo-container {
                position: relative;
            }

            .logo {
                height: 100px;
                position: absolute;
                top: -10%;
                display: block;
            }

            .nav-links {
                display: flex;
                gap: 20px;
                margin-left: auto;
            }

            .nav-links a {
                color: #fff;
                text-decoration: none;
                font-size: 16px;
                transition: color 0.3s ease;
            }

            .masonry-gallery {
  column-count: 3; /* Sarakkeiden määrä isommilla näytöillä */
  column-gap: 16px; /* Sarakkeiden välinen etäisyys */
  padding: 20px;
}

.masonry-item {
  break-inside: avoid; /* Estää kuvan katkeamisen sarakkeen vaihtuessa */
  margin-bottom: 16px; /* Rivien välinen etäisyys */
}

.masonry-item img {
  width: 100%;
  height: auto;
  display: block;
}

.masonry-item video {
    width: 100%;
    height: auto;
    display: block;
}

/* Responsiivisuus: vähennä sarakkeita mobiilissa */
@media (max-width: 768px) {
  .masonry-gallery {
    column-count: 2;
  }
}

@media (max-width: 480px) {
  .masonry-gallery {
    column-count: 1;
  }
}
